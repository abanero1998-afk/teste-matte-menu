<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spritzeria Teste Matte</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800&family=Great+Vibes&family=Playfair+Display:ital,wght@1,700;1,800&family=Source+Sans+3:ital,wght@0,400;0,700;1,700&display=swap" rel="stylesheet"/>
<style>
:root{--cyan:#1bb4e0;--ink:#1b1a18;--muted:#4a4741}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;background:radial-gradient(900px 500px at 12% 10%,rgba(90,214,245,.32),transparent 55%),radial-gradient(800px 520px at 88% 18%,rgba(255,210,160,.34),transparent 50%),linear-gradient(165deg,#f7f2ea 0%,#dceaf1 42%,#f0e6d8 100%);overflow-x:hidden}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
.scene{position:fixed;inset:0;pointer-events:none;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(8px);opacity:.55;animation:float 16s ease-in-out infinite}
.orb.a{width:240px;height:240px;left:6%;top:16%;background:radial-gradient(circle at 30% 30%,#fff,#7fd4ea 55%,transparent 70%)}
.orb.b{width:300px;height:300px;right:2%;top:6%;background:radial-gradient(circle at 30% 30%,#fff,#f0c38a 50%,transparent 70%);animation-duration:21s}
.orb.c{width:190px;height:190px;left:42%;bottom:8%;background:radial-gradient(circle at 30% 30%,#fff,#b9c7ff 50%,transparent 70%);animation-duration:14s}
@keyframes float{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(22px,-26px,50px) scale(1.08)}}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:18px 14px 40px}
.glass{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.55);backdrop-filter:blur(22px) saturate(1.35);-webkit-backdrop-filter:blur(22px) saturate(1.35);box-shadow:0 18px 40px rgba(40,30,20,.16),0 2px 0 rgba(255,255,255,.55) inset}
header.hero{text-align:center;padding:18px 16px 20px;border-radius:24px}
.logo{width:min(420px,92%);border-radius:16px;margin:0 auto 8px;display:block;box-shadow:0 16px 40px rgba(0,0,0,.25)}
.kicker{font-family:"Great Vibes",cursive;font-size:clamp(28px,7vw,44px)}
h1{font-family:Cinzel,serif;font-weight:800;font-size:clamp(26px,6.4vw,46px);color:#0b6f8c;text-transform:lowercase;font-style:italic}
.subtitle{font-family:"Playfair Display",serif;font-style:italic;font-weight:700;font-size:18px}
.toolbar,.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
button{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.55);padding:8px 12px;border-radius:999px;cursor:pointer;font:inherit;backdrop-filter:blur(14px)}
button.active{background:rgba(27,180,224,.72);color:#041018;font-weight:700}
nav.cats{display:flex;gap:8px;overflow-x:auto;padding:16px 2px 8px;position:sticky;top:0;z-index:5;background:rgba(247,242,234,.28);backdrop-filter:blur(16px)}
nav.cats button{white-space:nowrap;font-style:italic;font-weight:700;text-transform:lowercase}
section.cat{margin:22px 0 36px}
section.cat h2{font-family:"Playfair Display",serif;font-style:italic;font-weight:800;text-transform:lowercase;color:#0b6f8c;font-size:28px;border-bottom:1px solid rgba(11,111,140,.18);padding-bottom:6px;margin-bottom:14px}
.note{color:var(--muted);font-size:13px;margin:-8px 0 12px;font-style:italic}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
.card{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:10px;border-radius:18px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.58);backdrop-filter:blur(22px);box-shadow:0 16px 36px rgba(40,30,20,.18),0 1px 0 rgba(255,255,255,.7) inset}
.card img{width:92px;height:92px;object-fit:cover;border-radius:14px;box-shadow:0 10px 20px rgba(0,0,0,.18)}
.card h3{font-size:16px;font-weight:800;text-transform:lowercase;font-style:italic;font-family:"Playfair Display",serif}
.desc{color:var(--muted);font-size:13px;margin-top:4px}
.price{margin-top:6px;color:#0b6f8c;font-weight:800;font-style:italic}
.tags{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;border:1px solid rgba(255,255,255,.55);color:#0b6f8c;background:rgba(255,255,255,.2);padding:2px 7px;border-radius:999px;font-weight:700}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:40px;font-style:italic}
.legend{margin:18px 0;padding:12px;border-radius:16px;font-size:13px}
.staff{margin:28px auto 10px;max-width:420px;padding:16px;border-radius:20px;text-align:left}
.staff h3{color:#0b6f8c;font-style:italic;text-transform:lowercase;margin-bottom:8px}
.staff label{display:block;font-size:13px;margin:8px 0 4px;text-transform:lowercase}
.staff input,.staff select,.staff textarea{width:100%;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.55);padding:8px;border-radius:10px}
.preview{width:88px;height:88px;object-fit:cover;border-radius:14px;margin-top:8px;display:none;box-shadow:0 8px 16px rgba(0,0,0,.16)}
.plist{max-height:240px;overflow:auto;margin:10px 0;display:none}
.plist button{display:block;width:100%;text-align:left;margin:6px 0;text-transform:lowercase;font-style:italic}
.hidden{display:none!important}
.danger{color:#7a2a2a}
.tiny{opacity:.45;font-size:11px;letter-spacing:.12em;text-transform:lowercase;margin-top:18px}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="scene"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div>
<div class="wrap">
<header class="hero glass">
<img class="logo" alt="logo Teste Matte" src="logo-header.jpg" onerror="this.style.display='none'"/>
<div class="kicker">spritzeria</div>
<h1>teste matte</h1>
<div class="subtitle" id="tagline">menu digitale</div>
<div class="toolbar">
<button id="btn-it" class="active" onclick="setLang('it')">italiano</button>
<button id="btn-en" onclick="setLang('en')">english</button>
</div>
</header>
<div class="legend glass" id="legend"></div>
<nav class="cats" id="cat-nav"></nav>
<main id="menu"></main>
<footer>
<div id="service"></div>
<p style="margin-top:8px">spritzeria teste matte</p>
<div class="tiny">area riservata</div>
<div class="staff glass" id="gate">
<label id="lbl-pass">password</label>
<input id="gate-pass" type="password" autocomplete="off"/>
<div class="row"><button onclick="unlockStaff()">entra</button></div>
<p id="gate-msg" style="font-size:12px;margin-top:8px"></p>
</div>
<div class="staff glass hidden" id="studio">
<h3>modifica prodotto</h3>
<label>prodotto esistente</label>
<select id="f-pick" onchange="loadItem()"></select>
<label>categoria</label><select id="f-cat"></select>
<label>nome it</label><input id="f-name-it"/>
<label>nome en</label><input id="f-name-en"/>
<label>descrizione it</label><textarea id="f-desc-it" rows="2"></textarea>
<label>descrizione en</label><textarea id="f-desc-en" rows="2"></textarea>
<label>prezzo</label><input id="f-price"/>
<label>allergeni it</label><input id="f-all-it"/>
<label>allergeni en</label><input id="f-all-en"/>
<label>foto dalla galleria</label>
<input id="f-file" type="file" accept="image/*"/>
<img id="f-preview" class="preview" alt="anteprima"/>
<div class="row" style="margin-top:12px">
<button onclick="saveItem(false)">salva modifiche</button>
<button onclick="saveItem(true)">aggiungi nuovo</button>
<button class="danger" onclick="deleteItem()">elimina</button>
</div>
<div class="row">
<button onclick="resetMenu()">ripristina originale</button>
<button onclick="lockStaff()">esci</button>
</div>
</div>
</footer>
</div>
<script src="menu-data.js"></script>
<script>
let lang="it"; let menu=loadMenu(); let pendingImg=""; let staff=false;
function loadMenu(){try{const r=localStorage.getItem("tm-menu-v2");return r?JSON.parse(r):structuredClone(window.DEFAULT_MENU)}catch(e){return structuredClone(window.DEFAULT_MENU)}}
function saveMenu(){try{localStorage.setItem("tm-menu-v2",JSON.stringify(menu))}catch(e){alert(lang==="it"?"Memoria piena: usa una foto piu piccola":"Storage full: use a smaller photo")}}
function setLang(l){lang=l;document.getElementById("btn-it").classList.toggle("active",l==="it");document.getElementById("btn-en").classList.toggle("active",l==="en");document.getElementById("tagline").textContent=l==="it"?"menu digitale":"digital menu";document.getElementById("service").textContent=l==="it"?"servizio al tavolo \u20ac2,00":"table service \u20ac2.00";document.getElementById("legend").innerHTML=l==="it"?"<b>allergeni (indicativi):</b> glutine, crostacei, uova, pesce, arachidi, soia, latte, frutta a guscio, sedano, senape, sesamo, solfiti, lupini, molluschi. in caso di allergie gravi avvisare il personale.":"<b>allergens (indicative):</b> gluten, crustaceans, eggs, fish, peanuts, soy, milk, tree nuts, celery, mustard, sesame, sulphites, lupin, molluscs. always tell staff about severe allergies.";render(); if(staff) fillStudio();}
function render(){const nav=document.getElementById("cat-nav"),main=document.getElementById("menu");nav.innerHTML="";main.innerHTML="";menu.forEach(cat=>{const b=document.createElement("button");b.textContent=(cat.title[lang]||"").toLowerCase();b.onclick=()=>document.getElementById("cat-"+cat.id).scrollIntoView({behavior:"smooth"});nav.appendChild(b);const sec=document.createElement("section");sec.className="cat";sec.id="cat-"+cat.id;sec.innerHTML=`<h2>${(cat.title[lang]||"").toLowerCase()}</h2>${cat.note?`<div class=\"note\">${cat.note[lang]}</div>`:""}`;const grid=document.createElement("div");grid.className="grid";cat.items.forEach(it=>{const tags=(it.all&&it.all[lang]||[]).map(a=>`<span class=\"tag\">${a}</span>`).join("");const card=document.createElement("article");card.className="card";card.innerHTML=`<img src=\"${it.image||cat.image}\" alt=\"${it.name[lang]}\" loading=\"lazy\"/><div><h3>${(it.name[lang]||"").toLowerCase()}</h3>${it.desc&&it.desc[lang]?`<div class=\"desc\">${it.desc[lang]}</div>`:""}${it.price?`<div class=\"price\">${it.price}</div>`:""}${tags?`<div class=\"tags\">${tags}</div>`:""}</div>`;grid.appendChild(card);});sec.appendChild(grid);main.appendChild(sec);});}
function unlockStaff(){if(document.getElementById("gate-pass").value!=="testematte"){document.getElementById("gate-msg").textContent=lang==="it"?"password errata":"wrong password";return;}staff=true;document.getElementById("gate").classList.add("hidden");document.getElementById("studio").classList.remove("hidden");fillStudio();document.getElementById("studio").scrollIntoView({behavior:"smooth"});}
function lockStaff(){staff=false;document.getElementById("studio").classList.add("hidden");document.getElementById("gate").classList.remove("hidden");document.getElementById("gate-pass").value="";document.getElementById("gate-msg").textContent="";}
function fillStudio(){const pick=document.getElementById("f-pick"),cat=document.getElementById("f-cat");pick.innerHTML="<option value=\"\">— nuovo —</option>";cat.innerHTML="";menu.forEach(c=>{const o=document.createElement("option");o.value=c.id;o.textContent=c.title.it;cat.appendChild(o);c.items.forEach(it=>{const x=document.createElement("option");x.value=c.id+"::"+it.id;x.textContent=c.title.it+" — "+it.name.it;pick.appendChild(x);});});}
function currentItem(){const v=document.getElementById("f-pick").value;if(!v)return null;const [cid,iid]=v.split("::");const c=menu.find(x=>x.id===cid);return {cat:c,item:c.items.find(i=>i.id===iid)};}
function loadItem(){pendingImg="";const prev=document.getElementById("f-preview");prev.style.display="none";const cur=currentItem();if(!cur){document.getElementById("f-name-it").value="";document.getElementById("f-name-en").value="";document.getElementById("f-desc-it").value="";document.getElementById("f-desc-en").value="";document.getElementById("f-price").value="";document.getElementById("f-all-it").value="";document.getElementById("f-all-en").value="";return;}const it=cur.item;document.getElementById("f-cat").value=cur.cat.id;document.getElementById("f-name-it").value=it.name.it||"";document.getElementById("f-name-en").value=it.name.en||"";document.getElementById("f-desc-it").value=(it.desc&&it.desc.it)||"";document.getElementById("f-desc-en").value=(it.desc&&it.desc.en)||"";document.getElementById("f-price").value=it.price||"";document.getElementById("f-all-it").value=(it.all&&it.all.it||[]).join(", ");document.getElementById("f-all-en").value=(it.all&&it.all.en||[]).join(", ");if(it.image){prev.src=it.image;prev.style.display="block";}}
function readFields(){return {name:{it:document.getElementById("f-name-it").value.trim(),en:document.getElementById("f-name-en").value.trim()||document.getElementById("f-name-it").value.trim()},desc:{it:document.getElementById("f-desc-it").value.trim(),en:document.getElementById("f-desc-en").value.trim()},price:document.getElementById("f-price").value.trim(),all:{it:document.getElementById("f-all-it").value.split(",").map(s=>s.trim()).filter(Boolean),en:document.getElementById("f-all-en").value.split(",").map(s=>s.trim()).filter(Boolean)},image:pendingImg||undefined};}
function saveItem(asNew){if(!staff)return;const nameIt=document.getElementById("f-name-it").value.trim();if(!nameIt){alert("Nome obbligatorio");return;}const data=readFields();const cid=document.getElementById("f-cat").value;const cat=menu.find(c=>c.id===cid);if(asNew||!document.getElementById("f-pick").value){if(!data.image){const cur=currentItem();data.image=(cur&&cur.item.image)||undefined;}cat.items.push(Object.assign({id:"c"+Date.now()},data));}else{const cur=currentItem();if(!cur)return;if(!data.image)data.image=cur.item.image;Object.assign(cur.item,data);if(cur.cat.id!==cid){cur.cat.items=cur.cat.items.filter(i=>i.id!==cur.item.id);cat.items.push(cur.item);}}saveMenu();render();fillStudio();alert(lang==="it"?"Prodotto aggiornato":"Product updated");}
function deleteItem(){if(!staff)return;const cur=currentItem();if(!cur)return;if(!confirm(lang==="it"?"Eliminare questo prodotto?":"Delete this product?"))return;cur.cat.items=cur.cat.items.filter(i=>i.id!==cur.item.id);saveMenu();render();fillStudio();}
function resetMenu(){if(!staff)return;localStorage.removeItem("tm-menu-v2");menu=structuredClone(window.DEFAULT_MENU);render();fillStudio();}
document.getElementById("f-file").addEventListener("change",function(ev){const f=ev.target.files&&ev.target.files[0];if(!f)return;const img=new Image();const rd=new FileReader();rd.onload=function(){img.onload=function(){const m=360;let w=img.width,h=img.height;if(w>h&&w>m){h=h*m/w;w=m;}else if(h>m){w=w*m/h;h=m;}const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);pendingImg=cv.toDataURL("image/jpeg",0.62);const p=document.getElementById("f-preview");p.src=pendingImg;p.style.display="block";};img.src=rd.result;};rd.readAsDataURL(f);});
setLang("it");
(function(){const c=document.getElementById("fx"),x=c.getContext("2d");let w,h,pts=[],t=0;function resize(){w=c.width=innerWidth;h=c.height=innerHeight;const n=Math.min(80,Math.floor(w*h/15000));pts=[];for(let i=0;i<n;i++)pts.push({x:Math.random()*w,y:Math.random()*h,z:Math.random()*2+0.4,s:0.4+Math.random()*1.2});}addEventListener("resize",resize);resize();function tick(){t+=0.0045;x.clearRect(0,0,w,h);for(const p of pts){const fx=Math.sin(p.y*0.004+t*1.6)+Math.cos(p.x*0.003-t);const fy=Math.cos(p.x*0.004-t*1.3)+Math.sin(p.y*0.003+t*0.8);p.x+=fx*p.s*0.85;p.y+=fy*p.s*0.85;if(p.x<-20)p.x=w+20;if(p.x>w+20)p.x=-20;if(p.y<-20)p.y=h+20;if(p.y>h+20)p.y=-20;}for(let i=0;i<pts.length;i++){for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j],dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;if(d<11000){const o=1-d/11000;x.strokeStyle=`rgba(11,111,140,${0.09*o*(a.z+b.z)/2})`;x.lineWidth=0.7;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();}}}for(const p of pts){const r=1.2+p.z*2.2,g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,r*4);g.addColorStop(0,`rgba(255,255,255,${0.55*p.z})`);g.addColorStop(0.35,`rgba(90,214,245,${0.28*p.z})`);g.addColorStop(1,"rgba(255,255,255,0)");x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,r*3.2,0,Math.PI*2);x.fill();}requestAnimationFrame(tick);}tick();})();
</script>
</body>
</html>
