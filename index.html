<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spritzeria Teste Matte</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800&family=Great+Vibes&family=Playfair+Display:ital,wght@1,700;1,800&family=Source+Sans+3:ital,wght@0,400;0,700;1,700&display=swap" rel="stylesheet"/>
<style>
:root{--cyan:#1bb4e0;--ink:#1b1a18;--muted:#4a4741}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;background:radial-gradient(900px 500px at 12% 10%,rgba(90,214,245,.32),transparent 55%),radial-gradient(800px 520px at 88% 18%,rgba(255,210,160,.34),transparent 50%),linear-gradient(165deg,#f7f2ea 0%,#dceaf1 42%,#f0e6d8 100%);overflow-x:hidden}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
.scene{position:fixed;inset:0;pointer-events:none;z-index:0;perspective:900px}
.orb{position:absolute;border-radius:50%;filter:blur(8px);opacity:.55;animation:float 16s ease-in-out infinite}
.orb.a{width:240px;height:240px;left:6%;top:16%;background:radial-gradient(circle at 30% 30%,#fff,#7fd4ea 55%,transparent 70%)}
.orb.b{width:300px;height:300px;right:2%;top:6%;background:radial-gradient(circle at 30% 30%,#fff,#f0c38a 50%,transparent 70%);animation-duration:21s}
.orb.c{width:190px;height:190px;left:42%;bottom:8%;background:radial-gradient(circle at 30% 30%,#fff,#b9c7ff 50%,transparent 70%);animation-duration:14s}
@keyframes float{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(22px,-26px,50px) scale(1.08)}}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:18px 14px 90px}
.glass{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.55);backdrop-filter:blur(22px) saturate(1.35);-webkit-backdrop-filter:blur(22px) saturate(1.35);box-shadow:0 18px 40px rgba(40,30,20,.16),0 2px 0 rgba(255,255,255,.55) inset,0 28px 50px rgba(11,111,140,.08)}
header.hero{text-align:center;padding:18px 16px 20px;border-radius:24px}
.logo{width:min(420px,92%);border-radius:16px;margin:0 auto 8px;display:block;box-shadow:0 16px 40px rgba(0,0,0,.25)}
.kicker{font-family:"Great Vibes",cursive;font-size:clamp(28px,7vw,44px)}
h1{font-family:Cinzel,serif;font-weight:800;font-size:clamp(26px,6.4vw,46px);color:#0b6f8c;text-transform:lowercase;font-style:italic;text-shadow:0 8px 18px rgba(11,111,140,.18)}
.subtitle{font-family:"Playfair Display",serif;font-style:italic;font-weight:700;font-size:18px}
.toolbar,.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
button{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.55);padding:8px 12px;border-radius:999px;cursor:pointer;font:inherit;backdrop-filter:blur(14px);box-shadow:0 8px 18px rgba(0,0,0,.1),inset 0 1px 0 rgba(255,255,255,.7)}
button.active{background:rgba(27,180,224,.72);color:#041018;font-weight:700}
nav.cats{display:flex;gap:8px;overflow-x:auto;padding:16px 2px 8px;position:sticky;top:0;z-index:5;background:rgba(247,242,234,.28);backdrop-filter:blur(16px)}
nav.cats button{white-space:nowrap;font-style:italic;font-weight:700;text-transform:lowercase}
section.cat{margin:22px 0 36px}
section.cat h2{font-family:"Playfair Display",serif;font-style:italic;font-weight:800;text-transform:lowercase;color:#0b6f8c;font-size:28px;border-bottom:1px solid rgba(11,111,140,.18);padding-bottom:6px;margin-bottom:14px}
.note{color:var(--muted);font-size:13px;margin:-8px 0 12px;font-style:italic}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
.card{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:10px;border-radius:18px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.58);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);box-shadow:0 16px 36px rgba(40,30,20,.18),0 1px 0 rgba(255,255,255,.7) inset,0 22px 40px rgba(11,111,140,.07);transition:transform .35s ease,box-shadow .35s ease}
.card:hover{transform:translateY(-4px) rotateX(4deg);box-shadow:0 22px 46px rgba(40,30,20,.22),0 1px 0 rgba(255,255,255,.8) inset}
.card img{width:92px;height:92px;object-fit:cover;border-radius:14px;box-shadow:0 10px 20px rgba(0,0,0,.18);opacity:.92}
.card h3{font-size:16px;font-weight:800;text-transform:lowercase;font-style:italic;font-family:"Playfair Display",serif}
.desc{color:var(--muted);font-size:13px;margin-top:4px}
.price{margin-top:6px;color:#0b6f8c;font-weight:800;font-style:italic}
.tags{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;border:1px solid rgba(255,255,255,.55);color:#0b6f8c;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);padding:2px 7px;border-radius:999px;font-weight:700;box-shadow:0 4px 10px rgba(0,0,0,.06)}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:40px;font-style:italic}
.legend{margin:18px 0;padding:12px;border-radius:16px;font-size:13px}
.admin{display:none;padding:16px;margin:18px 0;border-radius:16px}
.admin.open{display:block}
.admin label{display:block;font-size:13px;margin:8px 0 4px}
.admin input,.admin select,.admin textarea{width:100%;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.55);padding:8px;border-radius:10px;backdrop-filter:blur(10px)}
.danger{color:#7a2a2a}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="scene"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div>
<div class="wrap">
<header class="hero glass">
<img class="logo" alt="logo Teste Matte" src="logo-header.jpg" onerror="this.style.display='none'"/>
<div class="kicker">spritzeria</div>
<h1>teste matte</h1>
<div class="subtitle" id="tagline">menu digitale</div>
<div class="toolbar">
<button id="btn-it" class="active" onclick="setLang('it')">italiano</button>
<button id="btn-en" onclick="setLang('en')">english</button>
<button onclick="document.getElementById('admin').classList.toggle('open')">admin</button>
</div>
</header>
<div id="admin" class="admin glass">
<h3 style="color:#0b6f8c;font-style:italic;text-transform:lowercase">gestione prodotti</h3>
<p style="font-size:13px">password: testematte</p>
<label>password</label><input id="admin-pass" type="password"/>
<label>azione</label><select id="admin-action"><option value="add">aggiungi</option><option value="remove">rimuovi</option></select>
<label>categoria</label><select id="admin-cat"></select>
<div id="add-fields">
<label>nome it</label><input id="f-name-it"/>
<label>nome en</label><input id="f-name-en"/>
<label>descrizione it</label><textarea id="f-desc-it" rows="2"></textarea>
<label>descrizione en</label><textarea id="f-desc-en" rows="2"></textarea>
<label>prezzo</label><input id="f-price"/>
<label>allergeni it</label><input id="f-all-it"/>
<label>allergeni en</label><input id="f-all-en"/>
<label>url immagine</label><input id="f-img"/>
</div>
<div id="remove-fields" style="display:none"><label>prodotto</label><select id="admin-item"></select></div>
<div class="row"><button onclick="applyAdmin()">salva</button><button class="danger" onclick="resetMenu()">ripristina originale</button></div>
</div>
<div class="legend glass" id="legend"></div>
<nav class="cats" id="cat-nav"></nav>
<main id="menu"></main>
<footer><div id="service"></div><p style="margin-top:8px">spritzeria teste matte</p></footer>
</div>
<script src="menu-data.js"></script>
<script>
let lang="it"; let menu=loadMenu();
function loadMenu(){try{const r=localStorage.getItem("tm-menu-v2");return r?JSON.parse(r):structuredClone(window.DEFAULT_MENU)}catch(e){return structuredClone(window.DEFAULT_MENU)}}
function saveMenu(){localStorage.setItem("tm-menu-v2",JSON.stringify(menu))}
function setLang(l){lang=l;document.getElementById("btn-it").classList.toggle("active",l==="it");document.getElementById("btn-en").classList.toggle("active",l==="en");document.getElementById("tagline").textContent=l==="it"?"menu digitale":"digital menu";document.getElementById("service").textContent=l==="it"?"servizio al tavolo \u20ac2,00":"table service \u20ac2.00";document.getElementById("legend").innerHTML=l==="it"?"<b>allergeni (indicativi):</b> glutine, crostacei, uova, pesce, arachidi, soia, latte, frutta a guscio, sedano, senape, sesamo, solfiti, lupini, molluschi. in caso di allergie gravi avvisare il personale.":"<b>allergens (indicative):</b> gluten, crustaceans, eggs, fish, peanuts, soy, milk, tree nuts, celery, mustard, sesame, sulphites, lupin, molluscs. always tell staff about severe allergies.";render();}
function render(){const nav=document.getElementById("cat-nav"),main=document.getElementById("menu");nav.innerHTML="";main.innerHTML="";const catSel=document.getElementById("admin-cat"),itemSel=document.getElementById("admin-item");catSel.innerHTML="";itemSel.innerHTML="";menu.forEach(cat=>{const b=document.createElement("button");b.textContent=(cat.title[lang]||"").toLowerCase();b.onclick=()=>document.getElementById("cat-"+cat.id).scrollIntoView({behavior:"smooth"});nav.appendChild(b);const o=document.createElement("option");o.value=cat.id;o.textContent=cat.title.it;catSel.appendChild(o);cat.items.forEach(it=>{const x=document.createElement("option");x.value=cat.id+"::"+it.id;x.textContent=cat.title.it+" \u2014 "+it.name.it;itemSel.appendChild(x)});const sec=document.createElement("section");sec.className="cat";sec.id="cat-"+cat.id;sec.innerHTML=`<h2>${(cat.title[lang]||"").toLowerCase()}</h2>${cat.note?`<div class=\"note\">${cat.note[lang]}</div>`:""}`;const grid=document.createElement("div");grid.className="grid";cat.items.forEach(it=>{const tags=(it.all&&it.all[lang]||[]).map(a=>`<span class=\"tag\">${a}</span>`).join("");const card=document.createElement("article");card.className="card";card.innerHTML=`<img src=\"${it.image||cat.image}\" alt=\"${it.name[lang]}\" loading=\"lazy\"/><div><h3>${(it.name[lang]||"").toLowerCase()}</h3>${it.desc&&it.desc[lang]?`<div class=\"desc\">${it.desc[lang]}</div>`:""}${it.price?`<div class=\"price\">${it.price}</div>`:""}${tags?`<div class=\"tags\">${tags}</div>`:""}</div>`;grid.appendChild(card);});sec.appendChild(grid);main.appendChild(sec);});}
document.getElementById("admin-action").onchange=e=>{document.getElementById("add-fields").style.display=e.target.value==="add"?"block":"none";document.getElementById("remove-fields").style.display=e.target.value==="remove"?"block":"none";};
function applyAdmin(){if(document.getElementById("admin-pass").value!=="testematte"){alert("Password errata");return;}if(document.getElementById("admin-action").value==="add"){const cat=menu.find(c=>c.id===document.getElementById("admin-cat").value);const nameIt=document.getElementById("f-name-it").value.trim();if(!nameIt){alert("Nome obbligatorio");return;}cat.items.push({id:"c"+Date.now(),name:{it:nameIt,en:document.getElementById("f-name-en").value.trim()||nameIt},desc:{it:document.getElementById("f-desc-it").value.trim(),en:document.getElementById("f-desc-en").value.trim()},price:document.getElementById("f-price").value.trim(),all:{it:document.getElementById("f-all-it").value.split(",").map(s=>s.trim()).filter(Boolean),en:document.getElementById("f-all-en").value.split(",").map(s=>s.trim()).filter(Boolean)},image:document.getElementById("f-img").value.trim()||undefined});}else{const [cid,iid]=document.getElementById("admin-item").value.split("::");const cat=menu.find(c=>c.id===cid);cat.items=cat.items.filter(i=>i.id!==iid);}saveMenu();render();}
function resetMenu(){if(document.getElementById("admin-pass").value!=="testematte"){alert("Password errata");return;}localStorage.removeItem("tm-menu-v2");menu=structuredClone(window.DEFAULT_MENU);render();}
setLang("it");
(function(){
  const c=document.getElementById("fx"),x=c.getContext("2d");
  let w,h,pts=[],t=0;
  function resize(){w=c.width=innerWidth;h=c.height=innerHeight;const n=Math.min(90,Math.floor(w*h/14000));pts=[];for(let i=0;i<n;i++)pts.push({x:Math.random()*w,y:Math.random()*h,z:Math.random()*2+0.4,a:Math.random()*Math.PI*2,s:0.4+Math.random()*1.2});}
  addEventListener("resize",resize);resize();
  function tick(){
    t+=0.0045; x.clearRect(0,0,w,h);
    for(const p of pts){
      const fx=Math.sin(p.y*0.004+t*1.6)+Math.cos(p.x*0.003-t);
      const fy=Math.cos(p.x*0.004-t*1.3)+Math.sin(p.y*0.003+t*0.8);
      p.x+=fx*p.s*0.85; p.y+=fy*p.s*0.85; p.a+=0.01*p.s;
      if(p.x<-20)p.x=w+20; if(p.x>w+20)p.x=-20; if(p.y<-20)p.y=h+20; if(p.y>h+20)p.y=-20;
    }
    for(let i=0;i<pts.length;i++){
      for(let j=i+1;j<pts.length;j++){
        const a=pts[i],b=pts[j],dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;
        if(d<11000){const o=1-d/11000;x.strokeStyle=`rgba(11,111,140,${0.09*o*(a.z+b.z)/2})`;x.lineWidth=0.7;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();}
      }
    }
    for(const p of pts){
      const r=1.2+p.z*2.2,g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,r*4);
      g.addColorStop(0,`rgba(255,255,255,${0.55*p.z})`); g.addColorStop(0.35,`rgba(90,214,245,${0.28*p.z})`); g.addColorStop(1,"rgba(255,255,255,0)");
      x.fillStyle=g; x.beginPath(); x.arc(p.x,p.y,r*3.2,0,Math.PI*2); x.fill();
    }
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
